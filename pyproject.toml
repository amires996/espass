[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espass-password-manager"
version = "1.1.0"
description = "Local-first encrypted desktop password manager"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Amir Mohammad Eskandari"}]
dependencies = ["cryptography>=42,<47", "argon2-cffi>=23.1,<26", "PySide6>=6.7,<7", "keyring>=25,<27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
espass = "pyvault.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
